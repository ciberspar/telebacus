<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>telebacus // Global Live TV</title>

  <!-- HLS.js para compatibilidad de streaming -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #090d16;
      color: #00f3ff;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    header {
      height: 55px;
      background: rgba(5, 12, 25, 0.95);
      border-bottom: 1px solid #00f3ff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
      z-index: 10;
      gap: 6px;
    }

    .brand-title {
      font-family: monospace;
      font-weight: bold;
      font-size: 0.95rem;
      letter-spacing: 1px;
      color: #00f3ff;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .header-controls {
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .select-box, .search-box, .num-box {
      background: rgba(0, 243, 255, 0.05);
      border: 1px solid rgba(0, 243, 255, 0.4);
      color: #fff;
      padding: 6px 6px;
      border-radius: 6px;
      font-family: monospace;
      outline: none;
      font-size: 0.75rem;
    }
    .select-box option { background: #050c19; color: #fff; }
    .search-box { width: 95px; }
    .num-box { width: 55px; text-align: center; }
    .select-box { width: 105px; }

    .main-content {
      display: flex;
      flex: 1;
      height: calc(100vh - 55px);
      overflow: hidden;
    }

    .video-section {
      flex: 1;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      max-height: 100%;
      object-fit: contain;
      background: #000;
      z-index: 1;
    }

    /* Pantalla de Error / Estática con la Tortuga */
    .error-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #050c19;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 3;
      gap: 12px;
      display: none;
    }

    .turtle-container {
      position: relative;
      font-size: 4rem;
      animation: temblor 0.2s infinite ease-in-out;
    }

    .error-badge {
      position: absolute;
      bottom: -5px; right: -5px;
      background: #ff4a4a;
      color: #fff;
      font-size: 1.2rem;
      border-radius: 50%;
      width: 25px; height: 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: monospace;
      font-weight: bold;
      border: 2px solid #050c19;
    }

    .error-text {
      font-family: monospace;
      font-size: 0.9rem;
      color: #ff4a4a;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    @keyframes temblor {
      0% { transform: translate(0, 0) rotate(0deg); }
      20% { transform: translate(-2px, 2px) rotate(-1deg); }
      40% { transform: translate(-1px, -2px) rotate(1deg); }
      60% { transform: translate(2px, 1px) rotate(0deg); }
      80% { transform: translate(1px, -1px) rotate(-1deg); }
      100% { transform: translate(0, 0) rotate(0deg); }
    }

    .channel-info-overlay {
      position: absolute;
      top: 15px; left: 15px;
      background: rgba(5, 12, 25, 0.85);
      border: 1px solid rgba(0, 243, 255, 0.4);
      padding: 8px 12px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(8px);
      z-index: 5;
    }

    .channel-info-overlay span {
      font-weight: bold;
      font-size: 0.85rem;
      color: #fff;
    }

    .channels-sidebar {
      width: 330px;
      background: rgba(5, 12, 25, 0.98);
      border-left: 1px solid rgba(0, 243, 255, 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .channels-header {
      padding: 12px;
      border-bottom: 1px solid rgba(0, 243, 255, 0.2);
      font-size: 0.8rem;
      font-weight: bold;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }

    .channels-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .channel-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .channel-card:hover { background: rgba(0, 243, 255, 0.1); }
    .channel-card.active {
      background: rgba(0, 243, 255, 0.25);
      border-left: 3px solid #00f3ff;
    }

    .channel-main-info {
      display: flex;
      align-items: center;
      gap: 8px;
      overflow: hidden;
      flex: 1;
    }

    .channel-num {
      font-family: monospace;
      font-size: 0.7rem;
      color: #00f3ff;
      background: rgba(0, 243, 255, 0.1);
      padding: 2px 4px;
      border-radius: 4px;
      min-width: 36px;
      text-align: center;
    }

    .channel-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
      flex: 1;
    }
    .channel-name {
      font-size: 0.8rem;
      font-weight: bold;
      color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .channel-meta {
      font-size: 0.65rem;
      color: #94a3b8;
      text-transform: uppercase;
    }

    .fav-btn {
      background: transparent;
      border: none;
      color: #555;
      font-size: 1.1rem;
      cursor: pointer;
      padding: 4px;
      transition: color 0.2s;
    }
    .fav-btn.is-fav {
      color: #ffd700;
    }
    .fav-btn:hover {
      transform: scale(1.15);
    }

    @media (max-width: 768px) {
      header { padding: 0 6px; }
      .brand-title { font-size: 0.75rem; }
      .main-content { flex-direction: column; }
      .video-section { height: 40vh; flex: none; }
      .channels-sidebar { width: 100%; flex: 1; border-left: none; border-top: 1px solid rgba(0, 243, 255, 0.2); }
      .search-box { width: 75px; }
      .num-box { width: 45px; }
      .select-box { width: 90px; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="brand-title">
        <span>📡</span> telebacus
      </div>
      <div class="header-controls">
        <input type="number" id="num-input" class="num-box" placeholder="N°" min="1" autocomplete="off" title="Número de canal (dial)">
        <select id="country-select" class="select-box">
          <option value="ALL">🌎 Todos</option>
          <option value="FAV">★ Favoritos</option>
        </select>
        <input type="text" id="search-input" class="search-box" placeholder="Buscar..." autocomplete="off">
      </div>
    </header>

    <div class="main-content">
      <div class="video-section">
        <!-- Pantalla de Error / Estática con la Tortuga -->
        <div class="error-overlay" id="error-screen">
          <div class="turtle-container">
            🐢
            <div class="error-badge">❌</div>
          </div>
          <div class="error-text">Señal caída o fuera de línea</div>
        </div>

        <div class="channel-info-overlay" id="current-info" style="display: none;">
          <span id="current-title">Sintonizando...</span>
        </div>
        <video id="video-player" controls autoplay playsinline webkit-playsinline></video>
      </div>

      <div class="channels-sidebar">
        <div class="channels-header">
          <span>CANALES SEGUROS (HTTPS)</span>
          <span id="channel-count">0</span>
        </div>
        <div class="channels-list" id="channels-container">
          <div style="padding: 20px; text-align: center; color: #94a3b8; font-size: 0.85rem;" id="loading-text">
            Cargando fuentes HLS de la API...
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var video = document.getElementById('video-player');
    var errorScreen = document.getElementById('error-screen');
    var hls = null;
    var listaCanalesGlobal = [];
    var favoritos = JSON.parse(localStorage.getItem('telebacus_favs') || '[]');

    async function inicializarTelebacus() {
      try {
        document.getElementById('loading-text').textContent = 'Obteniendo canales compatibles con HTTPS...';
        
        const [channelsRes, streamsRes] = await Promise.all([
          fetch('https://iptv-org.github.io/api/channels.json'),
          fetch('https://iptv-org.github.io/api/streams.json')
        ]);

        const channelsData = await channelsRes.json();
        const streamsData = await streamsRes.json();

        const streamMap = {};
        streamsData.forEach(s => {
          if (s.url && s.url.startsWith('https://') && s.url.includes('.m3u8') && !streamMap[s.channel]) {
            streamMap[s.channel] = s.url;
          }
        });

        listaCanalesGlobal = channelsData
          .filter(c => streamMap[c.id] && c.name)
          .map((c, index) => ({
            id: c.id,
            nombre: c.name,
            pais: c.country || 'INT',
            categoria: (c.categories && c.categories.length > 0) ? c.categories[0] : 'General',
            // Si la API provee un número de canal (chno), lo usamos; sino, generamos uno secuencial basado en su índice
            chno: c.chno ? parseInt(c.chno) : (index + 1),
            url: streamMap[c.id]
          }));

        listaCanalesGlobal.sort((a, b) => a.chno - b.chno);

        const select = document.getElementById('country-select');
        const paisesUnicos = Array.from(new Set(listaCanalesGlobal.map(c => c.pais))).sort();
        
        paisesUnicos.forEach(code => {
          var opt = document.createElement('option');
          opt.value = code;
          opt.textContent = code;
          select.appendChild(opt);
        });

        aplicarFiltros();
        if (listaCanalesGlobal.length > 0) {
          reproducirCanal(listaCanalesGlobal[0]);
        }

      } catch (error) {
        console.error('Error al cargar la API:', error);
        document.getElementById('channels-container').innerHTML = `
          <div style="padding: 20px; text-align: center; color: #ff4a4a; font-size: 0.85rem;">
            Error al conectar con la API global. Revisa tu conexión.
          </div>`;
      }
    }

    function obtenerCanalesFiltrados() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const paisSeleccionado = document.getElementById('country-select').value;

      return listaCanalesGlobal.filter(c => {
        const coincideTexto = c.nombre.toLowerCase().includes(query) || c.categoria.toLowerCase().includes(query) || c.chno.toString().includes(query);
        let coincidePais = true;
        if (paisSeleccionado === 'FAV') {
          coincidePais = favoritos.includes(c.id);
        } else if (paisSeleccionado !== 'ALL') {
          coincidePais = (c.pais === paisSeleccionado);
        }
        return coincideTexto && coincidePais;
      });
    }

    function renderizarCanales(canales) {
      const container = document.getElementById('channels-container');
      document.getElementById('channel-count').textContent = canales.length;
      container.innerHTML = '';

      if (canales.length === 0) {
        container.innerHTML = '<div style="padding: 20px; color: #94a3b8; font-size: 0.85rem;">No se encontraron canales.</div>';
        return;
      }

      canales.slice(0, 200).forEach((canal) => {
        const card = document.createElement('div');
        const esFav = favoritos.includes(canal.id);

        card.className = 'channel-card';
        card.innerHTML = `
          <div class="channel-main-info" onclick="seleccionarYReproducir('${canal.id}')">
            <span class="channel-num">#${canal.chno}</span>
            <div class="channel-details">
              <span class="channel-name">${canal.nombre}</span>
              <span class="channel-meta">[${canal.pais}] • ${canal.categoria}</span>
            </div>
          </div>
          <button class="fav-btn ${esFav ? 'is-fav' : ''}" onclick="toggleFavorito(event, '${canal.id}')" title="Favorito">★</button>
        `;

        container.appendChild(card);
      });
    }

    function aplicarFiltros() {
      const filtrados = obtenerCanalesFiltrados();
      renderizarCanales(filtrados);
    }

    function seleccionarYReproducir(idCanal) {
      const canal = listaCanalesGlobal.find(c => c.id === idCanal);
      if (canal) {
        document.querySelectorAll('.channel-card').forEach(el => el.classList.remove('active'));
        const cards = document.querySelectorAll('.channel-card');
        cards.forEach(card => {
          if (card.innerHTML.includes(canal.nombre)) {
            card.classList.add('active');
          }
        });
        reproducirCanal(canal);
      }
    }

    function toggleFavorito(event, idCanal) {
      event.stopPropagation();
      const index = favoritos.indexOf(idCanal);
      if (index > -1) {
        favoritos.splice(index, 1);
      } else {
        favoritos.push(idCanal);
      }
      localStorage.setItem('telebacus_favs', JSON.stringify(favoritos));
      aplicarFiltros();
    }

    function sintonizarPorDial(numeroDial) {
      const numeroBuscado = parseInt(numeroDial);
      const canalEncontrado = listaCanalesGlobal.find(c => c.chno === numeroBuscado);
      
      if (canalEncontrado) {
        document.getElementById('country-select').value = 'ALL';
        document.getElementById('search-input').value = '';
        aplicarFiltros();
        seleccionarYReproducir(canalEncontrado.id);
      } else {
        alert('No se encontró ningún canal con el número de dial #' + numeroDial);
      }
    }

    function mostrarErrorTortuga(mensaje) {
      errorScreen.style.display = 'flex';
      document.getElementById('current-title').textContent = mensaje;
    }

    function ocultarErrorTortuga() {
      errorScreen.style.display = 'none';
    }

    function reproducirCanal(canal) {
      document.getElementById('current-info').style.display = 'flex';
      document.getElementById('current-title').textContent = '[' + canal.chno + '] ' + canal.nombre + ' [' + canal.pais + '] (Cargando...)';
      ocultarErrorTortuga();

      if (hls) {
        hls.destroy();
        hls = null;
      }

      var streamUrl = canal.url;

      if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        video.load();
        video.play().then(() => {
          document.getElementById('current-title').textContent = '[' + canal.chno + '] ' + canal.nombre + ' [' + canal.pais + ']';
        }).catch(() => {
          mostrarErrorTortuga(canal.nombre + ' (Señal bloqueada)');
        });
      } 
      else if (Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          video.play().then(() => {
            document.getElementById('current-title').textContent = '[' + canal.chno + '] ' + canal.nombre + ' [' + canal.pais + ']';
          }).catch(() => {
            mostrarErrorTortuga(canal.nombre + ' (Clic para reproducir)');
          });
        });

        hls.on(Hls.Events.ERROR, function (event, data) {
          if (data.fatal) {
            mostrarErrorTortuga(canal.nombre + ' (Fuera de línea)');
          }
        });
      }
    }

    document.getElementById('search-input').addEventListener('input', aplicarFiltros);
    document.getElementById('country-select').addEventListener('change', aplicarFiltros);
    document.getElementById('num-input').addEventListener('change', function() {
      sintonizarPorDial(this.value);
    });
    document.getElementById('num-input').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        sintonizarPorDial(this.value);
      }
    });

    window.onload = inicializarTelebacus;
  </script>
</body>
</html>
