<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CyberTV // Global Live Stream Grid</title>

  <!-- HLS.js para reproducción de streams M3U8 -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #090d16;
      color: #00f3ff;
      overflow: hidden;
    }

    /* Layout Principal */
    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    /* Header Superior */
    header {
      height: 55px;
      background: rgba(5, 12, 25, 0.95);
      border-bottom: 1px solid #00f3ff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 15px;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
      z-index: 10;
      gap: 10px;
    }

    .brand-title {
      font-family: monospace;
      font-weight: bold;
      font-size: 0.9rem;
      letter-spacing: 1px;
      color: #00f3ff;
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .header-controls {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .search-box, .select-box {
      background: rgba(0, 243, 255, 0.05);
      border: 1px solid rgba(0, 243, 255, 0.4);
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-family: monospace;
      outline: none;
      font-size: 0.8rem;
    }
    .search-box:focus, .select-box:focus { border-color: #00f3ff; }
    .select-box option { background: #050c19; color: #fff; }

    /* Área Principal (Player + Lista) */
    .main-content {
      display: flex;
      flex: 1;
      height: calc(100vh - 55px);
      overflow: hidden;
    }

    /* Contenedor del Video */
    .video-section {
      flex: 1;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      max-height: 100%;
      object-fit: contain;
      background: #000;
    }

    .channel-info-overlay {
      position: absolute;
      top: 15px; left: 15px;
      background: rgba(5, 12, 25, 0.85);
      border: 1px solid rgba(0, 243, 255, 0.4);
      padding: 8px 12px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }

    .channel-info-overlay img {
      width: 28px; height: 28px;
      object-fit: contain;
    }

    .channel-info-overlay span {
      font-weight: bold;
      font-size: 0.9rem;
      color: #fff;
    }

    /* Barra Lateral de Canales */
    .channels-sidebar {
      width: 340px;
      background: rgba(5, 12, 25, 0.98);
      border-left: 1px solid rgba(0, 243, 255, 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .channels-header {
      padding: 12px;
      border-bottom: 1px solid rgba(0, 243, 255, 0.2);
      font-size: 0.8rem;
      font-weight: bold;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }

    .channels-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .channel-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .channel-card:hover {
      background: rgba(0, 243, 255, 0.1);
    }
    .channel-card.active {
      background: rgba(0, 243, 255, 0.25);
      border-left: 3px solid #00f3ff;
    }

    .channel-logo {
      width: 36px; height: 36px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 6px;
      object-fit: contain;
      padding: 2px;
    }

    .channel-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }
    .channel-name {
      font-size: 0.85rem;
      font-weight: bold;
      color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .channel-meta {
      font-size: 0.7rem;
      color: #94a3b8;
      text-transform: uppercase;
    }

    /* Adaptación para Celulares */
    @media (max-width: 768px) {
      header { padding: 0 10px; }
      .brand-title { font-size: 0.8rem; }
      .main-content { flex-direction: column; }
      .video-section { height: 40vh; flex: none; }
      .channels-sidebar { width: 100%; flex: 1; border-left: none; border-top: 1px solid rgba(0, 243, 255, 0.2); }
      .search-box { width: 110px; }
      .select-box { width: 90px; font-size: 0.75rem; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="brand-title">
        <span>🌐</span> CyberTV // GLOBAL GRID
      </div>
      <div class="header-controls">
        <select id="country-select" class="select-box">
          <option value="ALL">🌎 Todos los Países</option>
        </select>
        <input type="text" id="search-input" class="search-box" placeholder="Buscar..." autocomplete="off">
      </div>
    </header>

    <div class="main-content">
      <!-- Reproductor -->
      <div class="video-section">
        <div class="channel-info-overlay" id="current-info" style="display: none;">
          <img id="current-logo" src="" alt="Logo">
          <span id="current-title">Sintonizando...</span>
        </div>
        <video id="video-player" controls autoplay playsinline></video>
      </div>

      <!-- Lista de Canales -->
      <div class="channels-sidebar">
        <div class="channels-header">
          <span>CANALES GLOBALES</span>
          <span id="channel-count">0</span>
        </div>
        <div class="channels-list" id="channels-container">
          <div style="padding: 20px; text-align: center; color: #94a3b8; font-size: 0.85rem;">
            Cargando base de datos mundial...
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var video = document.getElementById('video-player');
    var hls = new Hls();
    var listaCanalesGlobal = [];

    var STREAMS_URL = 'https://iptv-org.github.io/api/streams.json';
    var CHANNELS_URL = 'https://iptv-org.github.io/api/channels.json';
    var COUNTRIES_URL = 'https://iptv-org.github.io/api/countries.json';

    async function cargarTransmisionesGlobales() {
      try {
        const [resStreams, resChannels, resCountries] = await Promise.all([
          fetch(STREAMS_URL),
          fetch(CHANNELS_URL),
          fetch(COUNTRIES_URL)
        ]);

        const streams = await resStreams.json();
        const channels = await resChannels.json();
        const countries = await resCountries.json();

        // Crear diccionario de países
        const paisesMapa = new Map();
        countries.forEach(c => paisesMapa.set(c.code, c.name));

        // Llenar el selector de países
        const countrySelect = document.getElementById('country-select');
        countries.sort((a, b) => a.name.localeCompare(b.name)).forEach(c => {
          var opt = document.createElement('option');
          opt.value = c.code;
          opt.textContent = c.name;
          countrySelect.appendChild(opt);
        });

        // Crear diccionario de canales
        const canalesMapa = new Map();
        channels.forEach(ch => {
          canalesMapa.set(ch.id, ch);
        });

        // Mapear TODAS las transmisiones mundiales válidas
        listaCanalesGlobal = streams
          .filter(st => canalesMapa.has(st.channel))
          .map(st => {
            const info = canalesMapa.get(st.channel);
            var paisCode = info.country || 'XX';
            return {
              id: st.channel,
              nombre: info.name,
              paisCode: paisCode,
              paisNombre: paisesMapa.get(paisCode) || 'Internacional',
              categoria: info.categories && info.categories.length > 0 ? info.categories[0] : 'General',
              logo: info.logo || 'https://via.placeholder.com/36?text=TV',
              url: st.url
            };
          })
          // Evitar duplicados por nombre
          .filter((v, i, a) => a.findIndex(t => t.nombre === v.nombre) === i);

        filtrarYRenderizar();

        if (listaCanalesGlobal.length > 0) {
          reproducirCanal(listaCanalesGlobal[0]);
        }
      } catch (err) {
        console.error('Error cargando canales globales:', err);
        document.getElementById('channels-container').innerHTML = 
          '<div style="padding: 20px; color: #ff3366; font-size: 0.85rem;">Error al conectar con la red global de streaming.</div>';
      }
    }

    function renderizarCanales(canales) {
      const container = document.getElementById('channels-container');
      document.getElementById('channel-count').textContent = canales.length;
      container.innerHTML = '';

      if (canales.length === 0) {
        container.innerHTML = '<div style="padding: 20px; color: #94a3b8; font-size: 0.85rem;">No se encontraron canales.</div>';
        return;
      }

      canales.forEach((canal, index) => {
        const card = document.createElement('div');
        card.className = 'channel-card' + (index === 0 ? ' active' : '');
        card.innerHTML = `
          <img class="channel-logo" src="${canal.logo}" onerror="this.src='https://via.placeholder.com/36?text=TV'" alt="logo">
          <div class="channel-details">
            <span class="channel-name">${canal.nombre}</span>
            <span class="channel-meta">${canal.paisNombre} • ${canal.categoria}</span>
          </div>
        `;

        card.onclick = function() {
          document.querySelectorAll('.channel-card').forEach(el => el.classList.remove('active'));
          card.classList.add('active');
          reproducirCanal(canal);
        };

        container.appendChild(card);
      });
    }

    function filtrarYRenderizar() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const paisSeleccionado = document.getElementById('country-select').value;

      const filtrados = listaCanalesGlobal.filter(c => {
        const coincideTexto = c.nombre.toLowerCase().includes(query) || c.categoria.toLowerCase().includes(query);
        const coincidePais = (paisSeleccionado === 'ALL' || c.paisCode === paisSeleccionado);
        return coincideTexto && coincidePais;
      });

      renderizarCanales(filtrados);
    }

    function reproducirCanal(canal) {
      document.getElementById('current-info').style.display = 'flex';
      document.getElementById('current-title').textContent = canal.nombre + ' (' + canal.paisNombre + ')';
      document.getElementById('current-logo').src = canal.logo;

      if (Hls.isSupported()) {
        hls.destroy();
        hls = new Hls();
        hls.loadSource(canal.url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          video.play().catch(() => console.log('Autoplay bloqueado'));
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = canal.url;
        video.addEventListener('loadedmetadata', function() {
          video.play();
        });
      }
    }

    document.getElementById('search-input').addEventListener('input', filtrarYRenderizar);
    document.getElementById('country-select').addEventListener('change', filtrarYRenderizar);

    cargarTransmisionesGlobales();
  </script>
</body>
</html>
