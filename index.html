<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>telebacus // Global Live TV</title>

  <!-- HLS.js para compatibilidad de streaming -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #090d16;
      color: #00f3ff;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    header {
      height: 55px;
      background: rgba(5, 12, 25, 0.95);
      border-bottom: 1px solid #00f3ff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.2);
      z-index: 10;
      gap: 6px;
    }

    .brand-title {
      font-family: monospace;
      font-weight: bold;
      font-size: 0.95rem;
      letter-spacing: 1px;
      color: #00f3ff;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .header-controls {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .select-box, .search-box {
      background: rgba(0, 243, 255, 0.05);
      border: 1px solid rgba(0, 243, 255, 0.4);
      color: #fff;
      padding: 6px 8px;
      border-radius: 6px;
      font-family: monospace;
      outline: none;
      font-size: 0.75rem;
    }
    .select-box option { background: #050c19; color: #fff; }
    .search-box { width: 110px; }
    .select-box { width: 115px; }

    .main-content {
      display: flex;
      flex: 1;
      height: calc(100vh - 55px);
      overflow: hidden;
    }

    .video-section {
      flex: 1;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      max-height: 100%;
      object-fit: contain;
      background: #000;
    }

    .channel-info-overlay {
      position: absolute;
      top: 15px; left: 15px;
      background: rgba(5, 12, 25, 0.85);
      border: 1px solid rgba(0, 243, 255, 0.4);
      padding: 8px 12px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      backdrop-filter: blur(8px);
      z-index: 5;
    }

    .channel-info-overlay span {
      font-weight: bold;
      font-size: 0.85rem;
      color: #fff;
    }

    .channels-sidebar {
      width: 320px;
      background: rgba(5, 12, 25, 0.98);
      border-left: 1px solid rgba(0, 243, 255, 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .channels-header {
      padding: 12px;
      border-bottom: 1px solid rgba(0, 243, 255, 0.2);
      font-size: 0.8rem;
      font-weight: bold;
      color: #94a3b8;
      display: flex;
      justify-content: space-between;
    }

    .channels-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .channel-card {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .channel-card:hover { background: rgba(0, 243, 255, 0.1); }
    .channel-card.active {
      background: rgba(0, 243, 255, 0.25);
      border-left: 3px solid #00f3ff;
    }

    .channel-details {
      display: flex;
      flex-direction: column;
      gap: 2px;
      overflow: hidden;
    }
    .channel-name {
      font-size: 0.85rem;
      font-weight: bold;
      color: #fff;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .channel-meta {
      font-size: 0.7rem;
      color: #94a3b8;
      text-transform: uppercase;
    }

    @media (max-width: 768px) {
      header { padding: 0 8px; }
      .brand-title { font-size: 0.8rem; }
      .main-content { flex-direction: column; }
      .video-section { height: 40vh; flex: none; }
      .channels-sidebar { width: 100%; flex: 1; border-left: none; border-top: 1px solid rgba(0, 243, 255, 0.2); }
      .search-box { width: 95px; }
      .select-box { width: 105px; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <div class="brand-title">
        <span>📡</span> telebacus
      </div>
      <div class="header-controls">
        <select id="country-select" class="select-box">
          <option value="ALL">🌎 Todos</option>
        </select>
        <input type="text" id="search-input" class="search-box" placeholder="Buscar..." autocomplete="off">
      </div>
    </header>

    <div class="main-content">
      <div class="video-section">
        <div class="channel-info-overlay" id="current-info" style="display: none;">
          <span id="current-title">Sintonizando...</span>
        </div>
        <video id="video-player" controls autoplay playsinline webkit-playsinline></video>
      </div>

      <div class="channels-sidebar">
        <div class="channels-header">
          <span>CANALES GLOBALES</span>
          <span id="channel-count">0</span>
        </div>
        <div class="channels-list" id="channels-container">
          <div style="padding: 20px; text-align: center; color: #94a3b8; font-size: 0.85rem;" id="loading-text">
            Filtrando señales estables de la API...
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var video = document.getElementById('video-player');
    var hls = null;
    var listaCanalesGlobal = [];

    async function inicializarTelebacus() {
      try {
        document.getElementById('loading-text').textContent = 'Conectando con API global...';
        
        const [channelsRes, streamsRes] = await Promise.all([
          fetch('https://iptv-org.github.io/api/channels.json'),
          fetch('https://iptv-org.github.io/api/streams.json')
        ]);

        const channelsData = await channelsRes.json();
        const streamsData = await streamsRes.json();

        const streamMap = {};
        streamsData.forEach(s => {
          // Priorizamos enlaces HTTPS directos que suelen ser mucho más estables
          if (s.url && !streamMap[s.channel]) {
            streamMap[s.channel] = s.url;
          } else if (s.url && s.url.startsWith('https://') && !streamMap[s.channel]) {
            streamMap[s.channel] = s.url;
          }
        });

        listaCanalesGlobal = channelsData
          .filter(c => streamMap[c.id] && c.name)
          .map(c => ({
            nombre: c.name,
            pais: c.country || 'INT',
            categoria: (c.categories && c.categories.length > 0) ? c.categories[0] : 'General',
            url: streamMap[c.id]
          }));

        // Ordenar alfabéticamente para mejor experiencia
        listaCanalesGlobal.sort((a, b) => a.nombre.localeCompare(b.nombre));

        const select = document.getElementById('country-select');
        const paisesUnicos = Array.from(new Set(listaCanalesGlobal.map(c => c.pais))).sort();
        
        paisesUnicos.forEach(code => {
          var opt = document.createElement('option');
          opt.value = code;
          opt.textContent = code;
          select.appendChild(opt);
        });

        aplicarFiltros();
        if (listaCanalesGlobal.length > 0) {
          reproducirCanal(listaCanalesGlobal[0]);
        }

      } catch (error) {
        console.error('Error al cargar la API:', error);
        document.getElementById('channels-container').innerHTML = `
          <div style="padding: 20px; text-align: center; color: #ff4a4a; font-size: 0.85rem;">
            Error al conectar con la API global. Revisa tu conexión.
          </div>`;
      }
    }

    function renderizarCanales(canales) {
      const container = document.getElementById('channels-container');
      document.getElementById('channel-count').textContent = canales.length;
      container.innerHTML = '';

      if (canales.length === 0) {
        container.innerHTML = '<div style="padding: 20px; color: #94a3b8; font-size: 0.85rem;">No se encontraron canales.</div>';
        return;
      }

      canales.slice(0, 200).forEach((canal, index) => {
        const card = document.createElement('div');
        card.className = 'channel-card' + (index === 0 ? ' active' : '');
        card.innerHTML = `
          <div class="channel-details">
            <span class="channel-name">${canal.nombre}</span>
            <span class="channel-meta">[${canal.pais}] • ${canal.categoria}</span>
          </div>
        `;

        card.onclick = function() {
          document.querySelectorAll('.channel-card').forEach(el => el.classList.remove('active'));
          card.classList.add('active');
          reproducirCanal(canal);
        };

        container.appendChild(card);
      });
    }

    function aplicarFiltros() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const paisSeleccionado = document.getElementById('country-select').value;

      const filtrados = listaCanalesGlobal.filter(c => {
        const coincideTexto = c.nombre.toLowerCase().includes(query) || c.categoria.toLowerCase().includes(query);
        const coincidePais = (paisSeleccionado === 'ALL' || c.pais === paisSeleccionado);
        return coincideTexto && coincidePais;
      });

      renderizarCanales(filtrados);
    }

    function reproducirCanal(canal) {
      document.getElementById('current-info').style.display = 'flex';
      document.getElementById('current-title').textContent = canal.nombre + ' [' + canal.pais + ']';

      if (hls) {
        hls.destroy();
        hls = null;
      }

      var streamUrl = canal.url;
      if (streamUrl.startsWith('http://')) {
        streamUrl = 'https://corsproxy.io/?' + encodeURIComponent(streamUrl);
      }

      if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        video.load();
        video.play().catch(() => console.log('Reproducción manual requerida'));
      } 
      else if (Hls.isSupported()) {
        hls = new Hls({ enableWorker: true, lowLatencyMode: true });
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, function() {
          video.play().catch(() => console.log('Interacción requerida'));
        });
        hls.on(Hls.Events.ERROR, function (event, data) {
          if (data.fatal) {
            document.getElementById('current-title').textContent = canal.nombre + ' (Señal fuera de línea)';
          }
        });
      }
    }

    document.getElementById('search-input').addEventListener('input', aplicarFiltros);
    document.getElementById('country-select').addEventListener('change', aplicarFiltros);

    window.onload = inicializarTelebacus;
  </script>
</body>
</html>
