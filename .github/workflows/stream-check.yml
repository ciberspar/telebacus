name: TeleBacus Global Stream Check

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"

permissions:
  contents: write

concurrency:
  group: telebacus-stream-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verificar transmisiones
        run: node scripts/check-streams.mjs

      - name: Publicar catálogo verificado
        run: |
          git config user.name "TeleBacus Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/health.json
          if git diff --cached --quiet; then
            echo "No hay cambios."
          else
            git commit -m "Update global stream health"
            git push
          fi